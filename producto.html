<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
          <link rel="icon" type="image/png" href="logo.jpeg">

    <title>Producto | Tomorrowland Store</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


<header class="header">

    <div class="logo-container">
        <a href="index.html">
            <img src="logo.jpeg" alt="Tomorrowland Store">
        </a>
    </div>

    <nav class="nav" id="main-nav">

        <a href="index.html">Inicio</a>

        <a href="tienda.html">Tienda</a>

        <a href="nosotros.html">Nosotros</a>

        <a href="contacto.html">Contacto</a>

    </nav>

    <div class="header-actions">

        <a href="tienda.html#carrito" class="cart">
            🛒 <span id="cart-count">0</span>
        </a>

        <button
            class="menu-toggle"
            id="menu-toggle"
            type="button"
            aria-label="Abrir menú">
            ☰
        </button>

    </div>

</header>



<section class="product-detail">


    <div class="detail-image">

        <div class="product-image">

            <span>
                TOMORROWLAND
            </span>

        </div>

    </div>



    <div class="detail-info">

        <p>
            TOMORROWLAND STORE
        </p>

        <h1>
            Tomorrowland Black
        </h1>

        <h2>
            $89.900
        </h2>


        <p class="description">

            Camiseta de estilo urbano,
            diseñada para representar
            la identidad de Tomorrowland Store.

        </p>


        <label>
            TALLA
        </label>


        <select id="size">

            <option>XS</option>

            <option>S</option>

            <option>M</option>

            <option>L</option>

            <option>XL</option>

        </select>


        <button class="buy-button"
                onclick="addToCart('Tomorrowland Black',89900)">

            AGREGAR AL CARRITO

        </button>


    </div>

</section>



<footer>

    <div class="footer-logo">

        <img src="img/logo.png">

    </div>

    <p>
        © 2026 Tomorrowland Store.
    </p>

</footer>


<script src="js/script.js"></script>

</body>

</html>
